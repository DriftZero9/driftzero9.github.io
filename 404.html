<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada | DriftZero</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#090a0d">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="alternate icon" href="favicon.ico" sizes="48x48">
  <style>
    :root{ --bg:#08090c; --orange:#ff6a00; --muted:#a7adb8; --line:#252a35; }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 85% -10%, rgba(255,106,0,.15), transparent 30%),
        var(--bg);
      color:#f4f6f8;text-align:center;padding:24px;line-height:1.55
    }
    .mark{
      width:64px;height:64px;margin:0 auto 28px;border-radius:18px;
      border:2px solid var(--orange);display:grid;place-items:center;position:relative
    }
    .mark::before,.mark::after{content:"";position:absolute;background:#fff;border-radius:999px}
    .mark::before{width:26px;height:3px}
    .mark::after{width:3px;height:26px}
    h1{font-size:clamp(2.4rem,8vw,4rem);letter-spacing:-.05em;margin:0 0 12px;line-height:1}
    p{color:#c5cad3;max-width:520px;margin:0 auto 28px}
    .code{color:var(--orange);font-weight:900}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    a.btn{
      border-radius:999px;padding:14px 22px;font-weight:800;text-decoration:none;
      display:inline-flex;align-items:center;gap:8px;min-height:48px;transition:.2s ease
    }
    .btn-primary{background:var(--orange);color:#111}
    .btn-primary:hover{transform:translateY(-2px)}
    .btn-secondary{background:#14171d;border:1px solid #2b3039;color:#fff}
    .btn-secondary:hover{border-color:#555e6d;transform:translateY(-2px)}
    footer{margin-top:40px;color:var(--muted);font-size:.82rem}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1><span class="code">404</span> Drift afuera, página afuera.</h1>
    <p>La dirección que buscaste no existe o se movió. Volvé al inicio o consultanos directo por WhatsApp.</p>
    <div class="actions">
      <a class="btn btn-primary" href="./">Volver al inicio</a>
      <a class="btn btn-secondary" href="https://wa.me/5491141637545?text=Hola%2C%20tengo%20una%20consulta%20sobre%20la%20reparaci%C3%B3n%20de%20mi%20DualSense%20PS5." rel="noopener">💬 WhatsApp</a>
    </div>
    <footer>DriftZero · Reparación de joysticks PS5 · CABA</footer>
  </main>
</body>
</html>
